# Source: nfs-subdir-external-provisioner/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-subdir-external-provisioner
  labels:
    chart: nfs-subdir-external-provisioner-4.0.18
    heritage: Helm
    app: nfs-subdir-external-provisioner
    release: nfs-subdir-external-provisioner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nfs-subdir-external-provisioner
      release: nfs-subdir-external-provisioner
  template:
    metadata:
      annotations:
      labels:
        app: nfs-subdir-external-provisioner
        release: nfs-subdir-external-provisioner
    spec:
      serviceAccountName: nfs-subdir-external-provisioner
      securityContext:
        {}
      imagePullSecrets:
        - name: cred-sysadmin
      containers:
        - name: nfs-subdir-external-provisioner
          #image: "registry.k8s.io/sig-storage/nfs-subdir-external-provisioner:v4.0.2"
          image: "git.mcf.co.id:5050/moofi/moofi-production-kube/nfs-subdir-external-provisioner:v4.0.2"
          imagePullPolicy: IfNotPresent
          securityContext:
            {}
          volumeMounts:
            - name: nfs-subdir-external-provisioner-root
              mountPath: /persistentvolumes
          env:
            - name: PROVISIONER_NAME
              value: cluster.local/nfs-subdir-external-provisioner
            - name: NFS_SERVER
              value: 172.16.100.195
            - name: NFS_PATH
              value: /NFS-K8-Prod
      volumes:
        - name: nfs-subdir-external-provisioner-root
          nfs:
            server: 172.16.100.195
            path: /NFS-K8-Prod
