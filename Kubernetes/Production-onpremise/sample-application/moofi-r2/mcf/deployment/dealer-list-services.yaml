apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: dealer-list-services
    version: v1
  name: dealer-list-services
  #namespace: development
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dealer-list-services
  template:
    metadata:
      labels:
        app: dealer-list-services
        version: v1
    spec:
      containers:
      - env:
        - name: ASPNETCORE_ENVIRONMENT
          value: Development
        - name: ASPNETCORE_URLS
          value: http://+:80
        - name: C_MOBILE
          valueFrom:
            configMapKeyRef:
              key: C_MOBILE
              name: moofi-cm
        - name: CONN_MASTER
          valueFrom:
            configMapKeyRef:
              key: CONN_MASTER
              name: moofi-cm
        - name: traefik_path
          value: dealer-list-service
        - name: base_url
          value: http://mobile.macf.co.id/
        image: git.mcf.co.id:5050/moofi/dealer.list.services/dealer.list.services:f7f5793
        imagePullPolicy: IfNotPresent
        name: dealer-list-services
        ports:
        - containerPort: 80
          protocol: TCP
        resources:
          limits:
            cpu: 50m
            memory: 128Mi
          requests:
            cpu: 25m
            memory: 128Mi
      imagePullSecrets:
      - name: cred-sysadmin
