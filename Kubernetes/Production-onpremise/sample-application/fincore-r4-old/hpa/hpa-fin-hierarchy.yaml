apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fin-hierarchy-services-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fin-hierarchy-services
  minReplicas: 1
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70
