apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-wekan
  labels:
    app: wekan
    chart: wekan-8.17.0
    component: wekan
    release: my-wekan
    heritage: Helm
spec:
  strategy:
  
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  replicas: 1
  selector:
    matchLabels:
      app: wekan
      component: wekan
      release: my-wekan
  template:
    metadata:
      annotations:
      labels:
        app: wekan
        component: wekan
        release: my-wekan
    spec:
      securityContext:
        {}
      serviceAccountName: my-wekan
      automountServiceAccountToken: false
      initContainers:
        - name: volume-permissions
          image: "docker.io/busybox:latest"
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c', 'chown -R 999:999 /data']
          volumeMounts:
            - name: shared-data-volume
              mountPath: /data
          resources:
            limits:
              cpu: 100m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            null
      containers:
        - name: wekan
          image: "ghcr.io/wekan/wekan:v8.17"
          imagePullPolicy: IfNotPresent
          terminationMessagePolicy: FallbackToLogsOnError
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ROOT_URL
              value: "https://wekan.local"
            - name: MONGO_URL
              value: "mongodb://my-wekan-mongodb-0.my-wekan-mongodb:27017/wekan"
            - name: MONGO_URL
              value: "mongodb://wekan-mongodb:27017"
          envFrom:
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 20
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 60
          securityContext:
            {}
          
          volumeMounts:
            - name: shared-data-volume
              mountPath: /data
          
          resources:
            limits:
              cpu: 500m
              memory: 1Gi
            requests:
              cpu: 300m
              memory: 128Mi
      
      volumes:
      - name: shared-data-volume
        persistentVolumeClaim:
          claimName: my-wekan-shared-data
