apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fin-masters-services-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fin-masters-services
  minReplicas: 2
  maxReplicas: 14
  metrics:
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 90
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
