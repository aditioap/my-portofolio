apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fin-creditsanalyst-services-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fin-creditsanalyst-services
  minReplicas: 4
  maxReplicas: 24
  metrics:
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 85
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
