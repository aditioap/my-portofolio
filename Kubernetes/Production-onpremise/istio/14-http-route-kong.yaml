apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kong-proxy-route
  namespace: kong
spec:
  parentRefs:
  - name: uat-gateway
    namespace: istio-system
  hostnames:
  - "uat-api-fincore.mcf.co.id"
  - "uat-api-fincore.maf.co.id"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: kong-proxy
      port: 80
