---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: rabbitmq-pv0
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Recycle
  storageClassName: managed-nfs-storage-dbbackup
  hostPath:
    path: "/var/lib/rabbitmq/mnesia"
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:  
  name: persistence-rabbitmq-uat-server-0
  namespace: rabbitmq-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: sc-maf-rabbitmq
  volumeMode: Filesystem
  volumeName: rabbitmq-pv0
---
apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  namespace: rabbitmq-system
  name: rabbitmq-uat
spec:
  replicas: 1
  resources:
    requests:
      cpu: 500m
      memory: 500Mi
    limits:
      cpu: 1
      memory: 1Gi
  rabbitmq:
    additionalConfig: |
      log.console.level = info
      default_user= macf 
      default_pass = macfjayajaya
      default_user_tags.administrator = true
  persistence:
    storageClassName: sc-maf-rabbitmq
    storage: 20Gi
  service:
    type: ClusterIP
  override:
    service:
      spec:
        ports:
        - port: 5672
          targetPort: 5672