apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: nginx-rs-test01
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx-pod-test01
  template:
    metadata:
      name: nginx-pod-test01
      labels:
        app: nginx-pod-test01
    spec:
      containers:
        - name: nginx-pod-test01
          image: nginx
          ports:
            - containerPort: 80

---

apiVersion: v1
kind: Service
metadata:
  name: nginx-svc-loadbalancer01
spec:
  type: LoadBalancer
  selector:
    app: nginx-pod-test01
  ports:
    - port: 80
      targetPort: 80