apiVersion: v1
kind: ServiceAccount
metadata:
  name: sysadmin
  namespace: kubernetes-dashboard

---
# ------------ Creating a ClusterRoleBinding -------------- #

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sysadmin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: sysadmin
  namespace: kubernetes-dashboard
