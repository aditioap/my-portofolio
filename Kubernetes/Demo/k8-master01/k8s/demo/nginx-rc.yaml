apiVersion: v1
kind: ReplicationController
metadata:
  name: nginx-rc-test1
  labels:
    environment: development 
spec:
  replicas: 3
  selector:
    app: nginx-rc-01
  template:
    metadata:
      name: nama-pod
      labels:
        app: nginx-rc-01
    spec:
      containers:
        - name: nginx-rc-01
          image: nginx
          ports:
            - containerPort: 80
