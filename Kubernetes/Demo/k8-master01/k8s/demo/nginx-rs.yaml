apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: nginx-rs-test01
  labels:
    environment: development
  # annotations:
  #   annotation-key1: annotation-value1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx-rs-01
  template:
    metadata:
      name: nginx-rs-test01
      labels:
        app: nginx-rs-01
    spec:
      containers:
      - name: nginx-rs-01
        image: nginx
        ports:
        - containerPort: 80
