apiVersion: v1
kind: Namespace
metadata:
  name: development

---

apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: nginx-rs-test01
  labels:
    app: nginx-pod-test01
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx-pod-test01
  template:
    metadata:
      labels:
        app: nginx-pod-test01
    spec:
      containers:
        - name: nginx-pod-test01
          image: nginx
          ports:
            - containerPort: 80

---

apiVersion: v1
kind: Service
metadata:
  name: nginx-svc-test01
  namespace: development
spec:
  selector:
    app: nginx-pod-test01
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-ingress-test01
  namespace: development
spec:
  ingressClassName: nginx
  rules:
    - host: test.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              # serviceName: nginx-svc-test01
              # servicePort: 80
              service:
                name: nginx-svc-test01
                port:
                  number: 80

---

apiVersion: v1
kind: Pod
metadata:
  name: curl
  namespace: development
  labels:
    name: curl
spec:
  containers:
    - name: curl
      image: khannedy/nginx-curl
