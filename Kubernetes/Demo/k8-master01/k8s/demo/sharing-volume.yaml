apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: nginx-rs-test03
  labels:
    app: nginx-pod-test03
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx-pod-test03
  template:
    metadata:
      name: nginx-pod-test03
      labels:
        app: nginx-pod-test03
    spec:
      volumes:
        - name: html
          emptyDir: {}
      containers:
        - name: nodejs-writer
          image: khannedy/nodejs-writer
          volumeMounts:
            - mountPath: /app/html
              name: html
        - name: nginx-pod-test03
          image: nginx
          ports:
            - containerPort: 80
          volumeMounts:
            - mountPath: /usr/share/nginx/html
              name: html

---

apiVersion: v1
kind: Service
metadata:
  name: nginx-svc-test03
spec:
  type: NodePort
  selector:
    app: nginx-pod-test03
  ports:
    - port: 8080
      targetPort: 80
      nodePort: 30001
